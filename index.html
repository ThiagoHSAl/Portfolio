<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <title>Thiago Almeida — Desenvolvedor · Visão computacional, agentes de IA e dados</title>
    <meta
      name="description"
      content="Portfólio de Thiago Henrique Silva de Almeida, desenvolvedor e graduando em Sistemas de Informação na UFMG. Visão computacional embarcada, agentes de IA e aplicações de dados — com projetos no ar e artigo publicado no IEEE."
    />
    <meta name="author" content="Thiago Henrique Silva de Almeida" />
    <meta name="theme-color" content="#070a10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thiagohsal.github.io/Portfolio/" />
    <meta property="og:site_name" content="Thiago Almeida" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Thiago Almeida — Desenvolvedor · Visão computacional, agentes de IA e dados" />
    <meta
      property="og:description"
      content="Visão computacional embarcada, agentes de IA e aplicações de dados. Projetos no ar e artigo publicado no IEEE."
    />
    <!-- Cartão 1200×630 gerado a partir do próprio layout do site (ver README). -->
    <meta property="og:image" content="https://thiagohsal.github.io/Portfolio/img/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Thiago Almeida — desenvolvedor. Visão computacional, agentes de IA e aplicações de dados." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://thiagohsal.github.io/Portfolio/img/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica tema e idioma antes da primeira pintura, para não haver "flash" de tema errado.
      try {
        const salvo = localStorage.getItem('theme')
        const escuro = salvo ? salvo === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.classList.toggle('dark', escuro)
        document.documentElement.lang = localStorage.getItem('lang') === 'en' ? 'en' : 'pt-BR'
      } catch {
        /* localStorage bloqueado: segue com o padrão escuro do HTML */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
