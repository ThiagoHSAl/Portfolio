<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <title>Thiago Almeida — Visão computacional, robótica aérea e IA aplicada</title>
    <meta
      name="description"
      content="Portfólio de Thiago Henrique Silva de Almeida: pesquisa em visão computacional e robótica aérea no VerLab/UFMG, detecção de pessoas por VANT para busca e salvamento, agentes de IA e engenharia de dados."
    />
    <meta name="author" content="Thiago Henrique Silva de Almeida" />
    <meta name="theme-color" content="#070a10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thiago Almeida — Visão computacional, robótica aérea e IA aplicada" />
    <meta
      property="og:description"
      content="Pesquisa em visão computacional e robótica aérea no VerLab/UFMG. Detecção e geolocalização de pessoas por VANT para busca e salvamento."
    />
    <meta property="og:image" content="https://thiagohsal.github.io/Portfolio/img/sar-deteccao.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica tema e idioma antes da primeira pintura, para não haver "flash" de tema errado.
      try {
        const salvo = localStorage.getItem('theme')
        const escuro = salvo ? salvo === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.classList.toggle('dark', escuro)
        document.documentElement.lang = localStorage.getItem('lang') === 'en' ? 'en' : 'pt-BR'
      } catch {
        /* localStorage bloqueado: segue com o padrão escuro do HTML */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
